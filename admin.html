<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gift Request Admin</title><link rel="stylesheet" href="style.css"></head><body><main class="wrap admin-wrap"><header class="hero"><div class="emoji">🛠️</div><p class="eyebrow">PRIVATE ADMIN AREA</p><h1>Gift request manager</h1><p class="sub">Create links, review lists and manage access.</p></header><div id="notice" class="notice hidden"></div>
<section id="loginPanel" class="panel"><h2>Admin sign in</h2><p class="muted">Enter the ADMIN_KEY you saved in Apps Script Script Properties.</p><form id="loginForm"><label>Admin key<input id="adminKey" type="password" autocomplete="current-password" required></label><button type="submit">Open dashboard</button></form></section>
<section id="dashboard" class="hidden"><section class="panel"><h2>Create an account</h2><form id="createForm"><label>Person's name<input id="newName" maxlength="100" required placeholder="e.g. Auntie Sarah"></label><button type="submit">Generate unique link</button></form><div id="createdLink" class="created hidden"></div></section><section class="list-head"><div><h2>Accounts</h2><p class="muted" id="accountCount">0 accounts</p></div><div class="actions"><button id="reload" class="secondary small" type="button">Refresh</button><button id="logout" class="secondary small" type="button">Sign out</button></div></section><div id="accounts" class="gift-list"></div><section id="detail" class="panel hidden"><div class="list-head"><div><h2 id="detailTitle">Gift requests</h2><p class="muted" id="detailMeta"></p></div><button class="secondary small" id="closeDetail" type="button">Close</button></div><div id="detailGifts" class="gift-list"></div></section></section><footer>Keep this admin key private. Anyone with it can manage accounts.</footer></main><script src="app.js"></script><script>
let adminKey=sessionStorage.getItem('giftAdminKey')||'';let accounts=[];
function notice(msg,kind='info'){const n=document.getElementById('notice');n.textContent=msg;n.className='notice '+kind;}
function clearNotice(){document.getElementById('notice').className='notice hidden';}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function showDashboard(){document.getElementById('loginPanel').classList.add('hidden');document.getElementById('dashboard').classList.remove('hidden');loadAccounts();}
async function call(action,data={}){return api(action,{adminKey,data});}
async function loadAccounts(){clearNotice();try{const r=await call('adminList');if(!r.ok)throw Error(r.error||'Could not load accounts.');accounts=r.accounts||[];renderAccounts();}catch(e){notice(e.message,'error');if(/admin access denied/i.test(e.message)){sessionStorage.removeItem('giftAdminKey');adminKey='';document.getElementById('dashboard').classList.add('hidden');document.getElementById('loginPanel').classList.remove('hidden');}}}
function renderAccounts(){document.getElementById('accountCount').textContent=`${accounts.length} account${accounts.length===1?'':'s'}`;const el=document.getElementById('accounts');if(!accounts.length){el.innerHTML='<div class="empty">No accounts yet. Create one above!</div>';return;}el.innerHTML=accounts.map(a=>`<article class="gift-card"><div class="gift-top"><span class="status ${a.status==='active'?'active':'inactive'}">${esc(a.status)}</span><span class="muted">${a.giftCount} gift${a.giftCount===1?'':'s'}</span></div><h3>${esc(a.name)}</h3><p class="muted">Created ${esc(new Date(a.createdAt).toLocaleDateString())}</p><div class="card-actions"><button class="small" onclick="viewAccount('${a.accountId}')">View gifts</button><button class="secondary small" onclick="toggle('${a.accountId}',${a.status!=='active'})">${a.status==='active'?'Deactivate':'Reactivate'}</button><button class="danger small" onclick="deleteAccount('${a.accountId}')">Delete account</button></div></article>`).join('');}
async function toggle(id,active){if(!confirm(`${active?'Reactivate':'Deactivate'} this account?`))return;try{const r=await call('adminToggle',{accountId:id,active});if(!r.ok)throw Error(r.error);notice(`Account ${active?'reactivated':'deactivated'}.`,'success');loadAccounts();}catch(e){notice(e.message,'error');}}
async function deleteAccount(id){const a=accounts.find(x=>x.accountId===id);if(!a||!confirm(`Permanently delete ${a.name} and all their gift requests? This cannot be undone.`))return;try{const r=await call('adminDelete',{accountId:id});if(!r.ok)throw Error(r.error);notice('Account and its gifts deleted.','success');document.getElementById('detail').classList.add('hidden');loadAccounts();}catch(e){notice(e.message,'error');}}
async function viewAccount(id){try{const r=await call('adminGifts',{accountId:id});if(!r.ok)throw Error(r.error);document.getElementById('detail').classList.remove('hidden');document.getElementById('detailTitle').textContent=r.account.name+"'s gifts";document.getElementById('detailMeta').textContent=`${r.gifts.length} gift requests · Account ${r.account.status}`;document.getElementById('detailGifts').innerHTML=r.gifts.length?r.gifts.map(g=>`<article class="gift-card"><div class="gift-top"><span class="priority p-${esc(g.priority.toLowerCase())}">${esc(g.priority)} priority</span><span class="price">${esc(g.price||'Price not set')}</span></div><h3>${esc(g.name)}</h3>${g.productLink?`<p><a href="${esc(g.productLink)}" target="_blank" rel="noopener noreferrer">View product ↗</a></p>`:''}${g.notes?`<p class="notes">${esc(g.notes).replace(/\n/g,'<br>')}</p>`:''}</article>`).join(''):'<div class="empty">No gifts requested yet.</div>';document.getElementById('detail').scrollIntoView({behavior:'smooth'});}catch(e){notice(e.message,'error');}}
document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();adminKey=document.getElementById('adminKey').value;try{const r=await api('adminList',{adminKey});if(!r.ok)throw Error(r.error||'Admin key not accepted.');sessionStorage.setItem('giftAdminKey',adminKey);showDashboard();}catch(err){notice(err.message,'error');}};
document.getElementById('createForm').onsubmit=async e=>{e.preventDefault();const name=document.getElementById('newName').value.trim();try{const r=await call('adminCreate',{name});if(!r.ok)throw Error(r.error);const userUrl=new URL('index.html',location.href);userUrl.searchParams.set('token',r.token);document.getElementById('createdLink').classList.remove('hidden');document.getElementById('createdLink').innerHTML=`<strong>Link created for ${esc(name)}</strong><p>Copy this link now and send it privately. The original access code is not stored in the sheet.</p><input id="newLinkValue" readonly value="${esc(userUrl.href)}"><button id="copyNewLink" type="button">Copy link</button>`;document.getElementById('copyNewLink').onclick=async()=>{try{await navigator.clipboard.writeText(userUrl.href);notice('Link copied!','success');}catch(_){document.getElementById('newLinkValue').select();notice('Select and copy the link manually.','info');}};document.getElementById('newName').value='';notice('Account created. Save the link now!','success');loadAccounts();}catch(err){notice(err.message,'error');}};
document.getElementById('reload').onclick=loadAccounts;document.getElementById('logout').onclick=()=>{sessionStorage.removeItem('giftAdminKey');adminKey='';document.getElementById('dashboard').classList.add('hidden');document.getElementById('loginPanel').classList.remove('hidden');document.getElementById('adminKey').value='';clearNotice();};document.getElementById('closeDetail').onclick=()=>document.getElementById('detail').classList.add('hidden');
if(adminKey){document.getElementById('adminKey').value=adminKey;showDashboard();}
</script></body></html>
