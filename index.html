<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Gift Requests</title><link rel="stylesheet" href="style.css"></head>
<body><main class="wrap"><header class="hero"><div class="emoji">🎁</div><p class="eyebrow">YOUR WISHLIST</p><h1 id="pageTitle">My gift requests</h1><p class="sub" id="intro">Keep track of all the gifts you would love.</p></header>
<div id="notice" class="notice hidden"></div><section id="app" class="hidden">
  <section class="panel"><h2 id="formHeading">Add a gift</h2><form id="giftForm"><input type="hidden" id="giftId"><label>Gift name <span class="required">*</span><input id="name" maxlength="200" required placeholder="e.g. A cosy blanket"></label><label>Product link <span class="muted">(optional)</span><input id="productLink" type="url" placeholder="https://..."></label><label>Price <span class="muted">(optional)</span><input id="price" maxlength="30" placeholder="e.g. £15"></label><label>Priority<select id="priority"><option>Normal</option><option>Low</option><option>High</option><option>Top</option></select></label><label>Notes <span class="muted">(optional)</span><textarea id="notes" maxlength="2000" rows="3" placeholder="Colour, size, or anything else..."></textarea></label><div class="actions"><button type="submit" id="saveBtn">Add gift</button><button type="button" id="cancelEdit" class="secondary hidden">Cancel edit</button></div></form></section>
  <section class="list-head"><div><h2>Your gifts</h2><p class="muted" id="giftCount">0 gifts</p></div><button class="secondary small" id="refreshBtn" type="button">Refresh</button></section><div id="giftList" class="gift-list"></div>
</section><footer>Only people with your unique link can access this list. Keep your link private.</footer></main>
<script src="app.js"></script><script>
const token = new URLSearchParams(location.search).get('token'); let gifts=[];
function setNotice(msg,kind='info'){const n=document.getElementById('notice');n.textContent=msg;n.className='notice '+kind;}
function clearNotice(){document.getElementById('notice').className='notice hidden';}
function safe(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function load(){clearNotice();if(!token){setNotice('This link is missing its access code. Please open the full link you were sent.','error');return;}api('userGet',{token}).then(r=>{if(!r.ok)throw Error(r.error||'Could not load this list.');document.getElementById('pageTitle').textContent=r.account.name+"'s gift requests";document.getElementById('app').classList.remove('hidden');gifts=r.gifts||[];render();}).catch(e=>setNotice(e.message,'error'));}
function render(){document.getElementById('giftCount').textContent=`${gifts.length} gift${gifts.length===1?'':'s'}`;const list=document.getElementById('giftList');if(!gifts.length){list.innerHTML='<div class="empty">✨ No gifts yet. Add your first idea above!</div>';return;}list.innerHTML=gifts.map(g=>`<article class="gift-card"><div class="gift-top"><span class="priority p-${safe(g.priority.toLowerCase())}">${safe(g.priority)} priority</span><span class="price">${safe(g.price||'Price not set')}</span></div><h3>${safe(g.name)}</h3>${g.productLink?`<p><a href="${safe(g.productLink)}" target="_blank" rel="noopener noreferrer">View product ↗</a></p>`:''}${g.notes?`<p class="notes">${safe(g.notes).replace(/\n/g,'<br>')}</p>`:''}<div class="card-actions"><button class="secondary small" onclick="editGift('${g.giftId}')">Edit</button><button class="danger small" onclick="removeGift('${g.giftId}')">Delete</button></div></article>`).join('');}
function resetForm(){document.getElementById('giftForm').reset();document.getElementById('giftId').value='';document.getElementById('formHeading').textContent='Add a gift';document.getElementById('saveBtn').textContent='Add gift';document.getElementById('cancelEdit').classList.add('hidden');}
function editGift(id){const g=gifts.find(x=>x.giftId===id);if(!g)return;document.getElementById('giftId').value=g.giftId;document.getElementById('name').value=g.name;document.getElementById('productLink').value=g.productLink;document.getElementById('price').value=g.price;document.getElementById('priority').value=g.priority;document.getElementById('notes').value=g.notes;document.getElementById('formHeading').textContent='Edit gift';document.getElementById('saveBtn').textContent='Save changes';document.getElementById('cancelEdit').classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'});}
async function removeGift(id){const g=gifts.find(x=>x.giftId===id);if(!g||!confirm(`Delete “${g.name}”?`))return;try{const r=await api('giftDelete',{token,data:{giftId:id}});if(!r.ok)throw Error(r.error);setNotice('Gift deleted.','success');load();}catch(e){setNotice(e.message,'error');}}
document.getElementById('giftForm').addEventListener('submit',async e=>{e.preventDefault();const giftId=document.getElementById('giftId').value;const data={name:document.getElementById('name').value,productLink:document.getElementById('productLink').value,price:document.getElementById('price').value,priority:document.getElementById('priority').value,notes:document.getElementById('notes').value};if(giftId)data.giftId=giftId;const btn=document.getElementById('saveBtn');btn.disabled=true;try{const r=await api(giftId?'giftUpdate':'giftAdd',{token,data});if(!r.ok)throw Error(r.error);resetForm();setNotice(giftId?'Gift updated!':'Gift added!','success');load();}catch(err){setNotice(err.message,'error');}finally{btn.disabled=false;}});
document.getElementById('cancelEdit').onclick=resetForm;document.getElementById('refreshBtn').onclick=load;load();
</script></body></html>
